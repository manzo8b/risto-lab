name: Food Cost Core QA
on:
  pull_request:
    paths:
      - 'public/instructor/food-cost-calculator/**'
      - '.github/workflows/food-cost-core.yml'
      - 'tests/food-cost.e2e.ts'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test public/instructor/food-cost-calculator/*.test.mjs

      - run: npm ci
      - run: npm run build
      - run: npx playwright test tests/food-cost.e2e.ts
