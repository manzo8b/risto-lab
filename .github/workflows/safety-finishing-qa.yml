name: Safety Lab Completion QA

on:
  pull_request:
    paths:
      - 'src/instructor/data/safety-evidence.ts'
      - 'src/instructor/pages/instructor/laboratorio-sicurezza/**'
      - 'src/instructor/pages/instructor/laboratorio-sicurezza.astro'
      - 'tests/safety-finishing.test.ts'
      - 'tests/safety-finishing.e2e.ts'
      - '.github/workflows/safety-finishing-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run publication:gate
      - run: npx playwright test tests/safety-finishing.e2e.ts
