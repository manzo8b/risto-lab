<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Food Cost Calculator · RISTO-LAB</title><style>
:root{--ink:#172a42;--muted:#52647a;--blue:#174e94;--line:#dce5ef;--soft:#f3f7fc}*{box-sizing:border-box}body{margin:0;background:white;color:var(--ink);font:16px/1.55 system-ui,sans-serif}main,header{max-width:1120px;margin:auto;padding:24px}header{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}a{color:var(--blue)}h1{font-size:clamp(28px,5vw,48px);line-height:1.1}h2{font-size:21px}section{border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}label{display:grid;gap:6px;min-width:0}input,select,button{font:inherit;max-width:100%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;background:white;color:var(--ink)}button{cursor:pointer;color:var(--blue)}button.primary{background:var(--blue);color:white}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}.metric{background:var(--soft);padding:16px;border-radius:12px;overflow-wrap:anywhere}.metric b{display:block;font-size:25px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}small,p{overflow-wrap:anywhere}#issues{white-space:pre-wrap;overflow-wrap:anywhere}#status{min-height:1.5em}footer{color:var(--muted);font-size:14px}</style></head><body><header><a href="../professional-suite/"><span data-t="back"></span></a><label><span data-t="language">Lingua</span><select id="lang"><option value="it">Italiano</option><option value="es">Español</option><option value="en">English</option></select></label></header><main><small>RISTO-LAB · PROFESSIONAL SUITE · <span data-t="preview"></span></small><h1>Food Cost Calculator</h1><p data-t="intro"></p><section><h2 data-t="import"></h2><div class="grid"><label><span data-t="recipeFile"></span><input id="recipes" type="file" accept=".json,application/json"></label><label><span data-t="supplierFile"></span><input id="suppliers" type="file" accept=".json,application/json"></label><label data-t-label="recipe"><span data-t="recipe"></span><select id="recipe"></select></label></div></section><section><h2 data-t="parameters"></h2><div class="grid"><label><span data-t="date"></span><input id="date" type="date"></label><label><span data-t="age"></span><input id="age" type="number" min="0" step="1" value="30"></label><label><span data-t="price"></span><input id="price" type="number" min="0" step="any"></label><label><span data-t="vat"></span><input id="vat" type="number" min="0" step="any" value="10"></label><label><span data-t="target"></span><input id="target" type="number" min="0.01" max="100" step="any" value="30"></label><label><span data-t="labor"></span><input id="labor" type="number" min="0" step="any"></label><label><span data-t="overhead"></span><input id="overhead" type="number" min="0" step="any"></label></div><div class="actions"><button class="primary" id="calculate" data-t="calculate"></button><button id="demo" data-t="demo"></button></div></section><section><h2 data-t="results"></h2><p id="status" role="status" aria-live="polite"></p><div class="grid" id="metrics"></div><p id="issues"></p><div class="actions"><button id="save" disabled data-t="save"></button><button id="json" disabled>JSON</button><button id="csv" disabled>CSV</button></div></section><section><h2 data-t="history"></h2><p data-t="local"></p><button id="refresh" data-t="refresh"></button><div id="history"></div></section><footer data-t="notice"></footer></main><script type="module">
import {runCost,integrate} from './adapter.mjs';import {saveRun,listRuns,deleteRun,exportJSON,exportCSV} from './storage.mjs';
const T={it:{language:'Lingua',intro:'Importa ricette e prezzi documentati. Nessun dato mancante viene considerato zero.',import:'1 · Archivi',recipe:'Ricetta',parameters:'2 · Parametri per porzione',date:'Data di calcolo',age:'Validità prezzo (giorni)',price:'Prezzo lordo (€)',vat:'IVA vendita (%)',target:'Food cost obiettivo (%)',labor:'Lavoro diretto (€)',overhead:'Costi indiretti (€)',calculate:'Calcola',demo:'Demo Roma (simulata)',results:'3 · Risultati',save:'Salva snapshot',history:'4 · Storico locale',local:'I dati restano nel browser. Esporta backup periodici.',refresh:'Aggiorna storico',notice:'Anteprima sperimentale. Prezzi importati non verificati. Nessuna certificazione contabile.',cost:'Costo ricetta',known:'Subtotale noto',perPortion:'Costo porzione',netRevenue:'Ricavo netto',foodCostPct:'Food cost %',cm1:'Margine I',targetGross:'Prezzo target lordo',primeCost:'Prime cost',fullCost:'Costo pieno',complete:'Completezza',missing:'Calcolo incompleto',ready:'Calcolo completato',saved:'Salvato',error:'Errore',remove:'Elimina',restore:'Apri'},es:{language:'Idioma',intro:'Importa recetas y precios documentados. Los datos ausentes no equivalen a cero.',import:'1 · Archivos',recipe:'Receta',parameters:'2 · Parámetros por ración',date:'Fecha de cálculo',age:'Validez del precio (días)',price:'Precio bruto (€)',vat:'IVA venta (%)',target:'Coste objetivo (%)',labor:'Trabajo directo (€)',overhead:'Costes indirectos (€)',calculate:'Calcular',demo:'Demo Roma (simulada)',results:'3 · Resultados',save:'Guardar cálculo',history:'4 · Historial local',local:'Datos en el navegador. Exporta copias periódicas.',refresh:'Actualizar historial',notice:'Vista experimental. Precios importados no verificados.',cost:'Coste receta',known:'Subtotal conocido',perPortion:'Coste ración',netRevenue:'Ingreso neto',foodCostPct:'Food cost %',cm1:'Margen I',targetGross:'Precio objetivo bruto',primeCost:'Coste primario',fullCost:'Coste completo',complete:'Cobertura',missing:'Cálculo incompleto',ready:'Cálculo completo',saved:'Guardado',error:'Error',remove:'Eliminar',restore:'Abrir'},en:{language:'Language',intro:'Import recipes and documented prices. Missing data is never zero.',import:'1 · Archives',recipe:'Recipe',parameters:'2 · Per-portion parameters',date:'Costing date',age:'Price validity (days)',price:'Gross selling price (€)',vat:'Sales VAT (%)',target:'Target food cost (%)',labor:'Direct labor (€)',overhead:'Allocated overhead (€)',calculate:'Calculate',demo:'Rome demo (simulated)',results:'3 · Results',save:'Save snapshot',history:'4 · Local history',local:'Data stays in this browser. Export regular backups.',refresh:'Refresh history',notice:'Experimental preview. Imported prices are unverified.',cost:'Recipe cost',known:'Known subtotal',perPortion:'Portion cost',netRevenue:'Net revenue',foodCostPct:'Food cost %',cm1:'Contribution I',targetGross:'Gross target price',primeCost:'Prime cost',fullCost:'Full cost',complete:'Coverage',missing:'Incomplete calculation',ready:'Calculation complete',saved:'Saved',error:'Error',remove:'Delete',restore:'Open'}};
for(const [lang,labels] of Object.entries({"it":{"back":"Torna alla Professional Suite","preview":"ANTEPRIMA","recipeFile":"Archivio ricette JSON","supplierFile":"Archivio fornitori JSON","simulated":"Simulato","unverified":"Non verificato","observed":"Osservato","benchmark":"Quotazione di mercato","invalid_schema":"Formato archivio non valido","invalid_link":"Collegamento ingrediente-prodotto non valido","invalid_date_policy":"Data o validità prezzo non valida","unknown_recipe":"Ricetta non trovata","missing_price_or_pack":"Prezzo o confezione mancante","missing_quantity_or_yield":"Quantità o resa mancante","incompatible_units":"Unità incompatibili","unlinked":"Prodotto non collegato","missing_stale_or_ambiguous_price":"Prezzo mancante, scaduto o ambiguo","invalid_parameter":"Parametro non valido","invalid_archive":"Archivio non valido","invalid_supplier_archive":"Archivio fornitori non valido","cycle":"Riferimento circolare","empty_recipe":"Ricetta vuota","subrecipe":"Sottoricetta","missing_recipe":"Ricetta mancante","overflow":"Valore fuori intervallo","demoName":"Carbonara — SIMULAZIONE"},"es":{"back":"Volver a Professional Suite","preview":"VISTA PREVIA","recipeFile":"Archivo de recetas JSON","supplierFile":"Archivo de proveedores JSON","simulated":"Simulado","unverified":"No verificado","observed":"Observado","benchmark":"Referencia de mercado","invalid_schema":"Formato de archivo no válido","invalid_link":"Vínculo ingrediente-producto no válido","invalid_date_policy":"Fecha o vigencia no válida","unknown_recipe":"Receta no encontrada","missing_price_or_pack":"Falta precio o envase","missing_quantity_or_yield":"Falta cantidad o rendimiento","incompatible_units":"Unidades incompatibles","unlinked":"Producto sin vincular","missing_stale_or_ambiguous_price":"Precio ausente, vencido o ambiguo","invalid_parameter":"Parámetro no válido","invalid_archive":"Archivo no válido","invalid_supplier_archive":"Archivo de proveedores no válido","cycle":"Referencia circular","empty_recipe":"Receta vacía","subrecipe":"Subreceta","missing_recipe":"Falta receta","overflow":"Valor fuera de rango","demoName":"Carbonara — SIMULACIÓN"},"en":{"back":"Back to Professional Suite","preview":"PREVIEW","recipeFile":"Recipe archive JSON","supplierFile":"Supplier archive JSON","simulated":"Simulated","unverified":"Unverified","observed":"Observed","benchmark":"Market benchmark","invalid_schema":"Invalid archive format","invalid_link":"Invalid ingredient-product link","invalid_date_policy":"Invalid date or price validity","unknown_recipe":"Recipe not found","missing_price_or_pack":"Missing price or pack","missing_quantity_or_yield":"Missing quantity or yield","incompatible_units":"Incompatible units","unlinked":"Unlinked product","missing_stale_or_ambiguous_price":"Missing, stale or ambiguous price","invalid_parameter":"Invalid parameter","invalid_archive":"Invalid archive","invalid_supplier_archive":"Invalid supplier archive","cycle":"Circular reference","empty_recipe":"Empty recipe","subrecipe":"Subrecipe","missing_recipe":"Missing recipe","overflow":"Value out of range","demoName":"Carbonara — SIMULATION"}}))Object.assign(T[lang],labels);
const $=id=>document.getElementById(id);let a,s,run,history=[],demoHistory=[];const t=k=>T[$('lang').value][k]??k;const say=x=>$('status').textContent=x;const num=id=>$(id).value===''?null:Number($(id).value);const date=new Date().toISOString().slice(0,10);$('date').value=date;
function invalidate(){run=null;$('metrics').replaceChildren();$('issues').textContent='';for(const id of ['save','json','csv'])$(id).disabled=true}
function options(){const sel=$('recipe');sel.replaceChildren();for(const r of a?.recipes??[]){const o=document.createElement('option');o.value=r.id;o.textContent=r.id==='DEMO-ROMA'?t('demoName'):r.name;sel.append(o)}}
function render(){if(!run)return;const entries={cost:run.result.cost,known:run.result.knownSubtotal,...run.metrics};$('metrics').replaceChildren();for(const [k,v] of Object.entries(entries)){const d=document.createElement('div');d.className='metric';const b=document.createElement('b');b.textContent=v==null?'—':k==='foodCostPct'?v.toFixed(2)+'%':new Intl.NumberFormat($('lang').value,{style:'currency',currency:'EUR'}).format(v);d.append(document.createTextNode(t(k)),b);$('metrics').append(d)}$('issues').textContent=t('complete')+': '+run.result.covered+'/'+run.result.count+' · '+run.sourceStatus.map(t).join(', ')+'\n'+[...run.result.issues.map(x=>x.split(':').map(t).join(': ')),...run.excluded.map(x=>x.recipeId+' / '+(x.index+1)+': '+t(x.reason))].join('\n');say(t(run.result.cost===null?'missing':'ready'));for(const id of ['save','json','csv'])$(id).disabled=false}
function translate(){const selected=$('recipe').value;options();$('recipe').value=selected;document.documentElement.lang=$('lang').value;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));render();renderHistory()}
$('lang').onchange=translate;for(const id of ['recipe','date','age','price','vat','target','labor','overhead'])$(id).oninput=invalidate;
for(const [id,kind] of [['recipes','a'],['suppliers','s']])$(id).onchange=async()=>{invalidate();demoHistory=[];if(kind==='a'){a=null;options()}else s=null;try{const x=JSON.parse(await $(id).files[0].text());if(kind==='a'){if(x.schema!=='ristolab.recipe-archive/1'||!Array.isArray(x.recipes))throw Error('invalid archive');a=x;options()}else{if(x.schema!=='ristolab.supplier-links/1')throw Error('invalid supplier archive');s=x}if(a&&s)integrate(a,s);say('✓')}catch(e){if(kind==='a'){a=null;options()}else s=null;say(t('error')+': '+t(e.message.replaceAll(' ','_')))}};
$('calculate').onclick=()=>{invalidate();try{for(const id of ['date','age','price','vat','target','labor','overhead'])if(!$(id).checkValidity())throw Error('invalid parameter');run=runCost(a,s,$('recipe').value,{asOf:$('date').value,maxAgeDays:num('age'),grossPrice:num('price'),vat:num('vat'),target:num('target'),labor:num('labor'),overhead:num('overhead'),history:demoHistory});render()}catch(e){say(t('error')+': '+t(e.message.replaceAll(' ','_')))}};
$('demo').onclick=()=>{invalidate();$('recipes').value='';$('suppliers').value='';a={schema:'ristolab.recipe-archive/1',recipes:[{id:'DEMO-ROMA',name:'Carbonara — SIMULATION',servings:1,ingredients:[{name:'Pasta',gross:120,unit:'g'},{name:'Guanciale',gross:60,unit:'g'},{name:'Pecorino',gross:35,unit:'g'},{name:'Uova',gross:2,unit:'ud'},{name:'Pepe',gross:2,unit:'g'}],subrecipes:[]}]};s={schema:'ristolab.supplier-links/1',currency:'EUR',priceBasis:'net_excluding_vat',products:[2,18,20,.3,30].map((price,i)=>({id:'DEMO-'+i,price,pack:1,unit:i===3?'ud':'kg',date:''})),links:a.recipes[0].ingredients.map((x,i)=>({recipeId:'DEMO-ROMA',index:i,ingredientName:x.name,productId:'DEMO-'+i}))};demoHistory=s.products.map(p=>({...p,productId:p.id,date,status:'simulated'}));options();$('date').value=date;$('price').value=14;$('vat').value=10;$('target').value=30;$('labor').value='';$('overhead').value='';run=runCost(a,s,'DEMO-ROMA',{asOf:date,grossPrice:14,vat:10,target:30,history:demoHistory});render()};
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type}));const e=document.createElement('a');e.href=url;e.download=name;e.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('json').onclick=()=>download(exportJSON(run),'food-cost.json','application/json');$('csv').onclick=()=>download(exportCSV(run),'food-cost.csv','text/csv');$('save').onclick=async()=>{try{await saveRun(run);await refresh();say(t('saved'))}catch(e){say(t('error')+': '+t(e.message.replaceAll(' ','_')))}};
function renderHistory(){$('history').replaceChildren();for(const x of history){const p=document.createElement('p');p.textContent=x.run.recipeId+' · '+x.savedAt+' ';const b=document.createElement('button');b.textContent=t('restore');b.onclick=()=>{run=x.run;render()};const d=document.createElement('button');d.textContent=t('remove');d.onclick=async()=>{try{await deleteRun(x.id);await refresh()}catch(e){say(t('error')+': '+t(e.message.replaceAll(' ','_')))}};p.append(b,d);$('history').append(p)}}
async function refresh(){try{history=await listRuns();renderHistory()}catch(e){say(t('error')+': '+t(e.message.replaceAll(' ','_')))}}$('refresh').onclick=refresh;translate();refresh();
</script></body></html>
