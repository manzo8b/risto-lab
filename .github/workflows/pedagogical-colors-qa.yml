name: Pedagogical Colors Audit QA

on:
  pull_request:
    paths:
      - 'src/styles/learning-colors.css'
      - 'src/layouts/Instructor.astro'
      - 'src/layouts/Public.astro'
      - 'src/instructor/pages/instructor/laboratorio-sicurezza/lezioni/[slug].astro'
      - 'tests/pedagogical-colors.test.ts'
      - 'tests/pedagogical-colors.e2e.ts'
      - '.github/workflows/pedagogical-colors-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run publication:gate
      - run: npx playwright test tests/pedagogical-colors.e2e.ts
