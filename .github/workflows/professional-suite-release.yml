name: Professional Suite 1.0 release gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Verify all standalone economic and publication engines
        run: node --test public/instructor/food-cost-calculator/*.test.mjs public/instructor/menu-design-studio/*.test.mjs public/instructor/restaurant-simulator/*.test.mjs tests/menu-classify.test.mjs
      - run: npm run build
      - run: node scripts/release-manifest.mjs --self-test
      - run: npm run release:manifest && npm run release:verify
      - run: npm run audit:portability
      - run: npm run publication:gate
      - run: npx playwright test tests/suite-ux.e2e.ts tests/human-review.e2e.ts tests/quality-history.e2e.ts tests/menu-dashboard.e2e.ts tests/food-cost.e2e.ts tests/matrice-allergeni.e2e.ts tests/professional-release.e2e.ts
