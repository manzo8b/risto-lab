name: White Ecosystem — Full UI QA

on:
  pull_request:
    paths:
      - 'src/styles/white-ecosystem.css'
      - 'src/styles/editorial-v3.css'
      - 'public/brand/**'
      - 'src/layouts/**'
      - 'src/instructor/pages/**'
      - 'public/materiali/mise-en-place-masterclass.html'
      - 'tests/white-ecosystem.*'
      - '.github/workflows/white-ecosystem-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run publication:gate
      - name: White design, mobile navigation and accessibility regression
        run: npx playwright test tests/white-ecosystem.e2e.ts tests/quality-audit.e2e.ts
