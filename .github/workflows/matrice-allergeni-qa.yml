name: Matrice Allergeni — Beta Release Gate
on:
  pull_request:
    paths:
      - 'public/instructor/menu-engineering/matrice-allergeni/**'
      - 'src/instructor/pages/instructor/menu-engineering/**'
      - 'tests/matrice-allergeni.e2e.ts'
      - '.github/workflows/matrice-allergeni-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  beta-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test tests/matrice-allergeni.e2e.ts
