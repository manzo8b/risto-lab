name: Unlisted Consilia Portfolio QA

on:
  pull_request:
    paths:
      - 'src/instructor/pages/atelier/scheda-pc4m8q2.astro'
      - 'tests/consilia-unlisted.test.ts'
      - 'tests/consilia-unlisted.e2e.ts'
      - '.github/workflows/consilia-unlisted-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run publication:gate
      - run: npx playwright test tests/consilia-unlisted.e2e.ts
